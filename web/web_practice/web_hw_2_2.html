<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
        display: flex;
        font-family: Arial, sans-serif;
    }

    .card {
        width: 300px;
        border: 1px solid #333;
    }

    .image-container {
        position: relative;
        overflow: hidden;
    }

    .profile-img {
        width: 100%;
        display: block;
    }

    .name {
        position: absolute;
        bottom: 0;
        left: 20px;
        right: 20px;

        box-sizing: border-box;
        margin: 0;

        background-color: rgba(244, 190, 143, 0.7);
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        padding: 10px 0;
    }

    .description {
        padding: 15px;
        line-height: 1.5;
    }
  
  </style>
</head>
<body>
  <div class="card">
    <div class="image-container">
      <img src="profile.jpg" alt="Profile Image" class="profile-img">
      <p class="name">Name</p>
    </div>

    <p class="description">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci unde officiis ad nostrum. Laboriosam mollitia similique provident fuga tenetur saepe sit, amet eaque neque eius quaerat expedita ea illum veniam.
    </p>
  </div>
</body>
</html>
