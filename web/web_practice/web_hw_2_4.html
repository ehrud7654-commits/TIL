<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div > p {
      color: crimson;
    }
    div > div p {
      color: blue;
      margin-left: 30px;
    }

  </style>
</head>
<body>
    <div>
        <p>자식</p>
        <div>
            <p>손자</p>
        </div>
        <p>자식</p>
    </div>
  
</body>
</html>

<!-- 자손 결합자는 div안에 있는 모든 p 를 의미한다. 
div 바로 아래가 아니어도, 여러 단계 아래 p도 포함을 의미한다. -->

<!-- 자식 결합자는 div의 직접 자식인 p만을 의미한다. 
div안에 있지만 2단계 아래인 p는 적용되지 않는다. -->
