<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      font-weight: bold;
    }
  </style>
  <title>Login</title>
</head>
<body>
    <form> 
        <div>
            <label for = "id">USERNAME:</label>
            <input
              id= "id"
              type="text"
              name="user_id"
              placeholder="아이디를 입력 해 주세요."
              required
            >
        </div>

        <div>
          <label for="pw">PWD:</label>
          <input
            id="pw"
            type="password"
            name="user_pw"
            placeholder=""
            required
           >
           <button type="submit">로그인</button>
        </div>
    </form>
</body>
</html>
