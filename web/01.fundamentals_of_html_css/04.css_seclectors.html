<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 전체 선택자 */
    /* html의 모든 요소를 선택 */
    * {
      color: red;
    }
    /* 요소 선택자 */
    /* 지정한 모든 태그를 선택 */
    h2 {
      color: orange;
    }

    h3,
    h4 {
      color: blue;
    }

    /* class 선택자 */
    /* 주어진 클래스 속성을 가진 모든 요소를 선택 */
    .green {
      color: green;
    }

    /* id 선택자 */
    /* 주어진 아이디 속성을 가진 요소 선택
    문서에는 주어진 아이디를 가진 요소가 하나만 있어야함 */
    #purple {
      color: purple;
    }

    /* 자식 결합자 */
    /* 첫번째 요소의 직계 자식만 선택 */
    .green > span {
      font-size: 50px;
    }

    /* 자손 결합자 */
    /* 첫번째 요소의 자손 요소들 선택 */
    .green li {
      color: brown;
    }

    /* 속성 선택자 (참고) */
    /* 주어진 속성이나 속성값을 가진 모든 요소 선택
    속성의 존재 여부, 값의 일치/포함 등 다양한 조건으로 요소를
    정교하게 선택 가능 */
    [class^="y"] {
      color: yellow;
    }
  </style>
</head>

<body>
  <h1 class="green">Heading</h1>
  <h2>선택자</h2>
  <h3>연습</h3>
  <h4>반가워요</h4>
  <p id="purple">과목 목록</p>
  <ul class="green">
    <li>파이썬</li>
    <li>알고리즘</li>
    <li>웹
      <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>PYTHON</li>
      </ol>
    </li>
  </ul>
  <p class="green">Lorem, <span>ipsum</span> dolor.</p>
  <p class="yellow">TEST</p>
</body>

</html>
