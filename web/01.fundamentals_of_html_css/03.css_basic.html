<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- External style ->  별도 css 파일 생성 후 html link 태그 사용해 불러옴 -->
  <link rel="stylesheet" href="style.css">
  <!-- Internal style -> head 태그 안에 style 태그에 작성 -->
  <style>
    h2 {
      color: red;
    }
  </style>
</head>

<body>
  <!-- Inline style -> 태그안에 직접 작성, 우선순위 제일 높음 -->
  <h1 style="color: blue; background-color: yellow;">Inline Style</h1>
  <h2>Internal Style</h2>
  <h3>External Style</h3>
</body>

</html>

<!-- CSS 적용 우선순위
Inline style -> Internal style -> External style -> 브라우저 기본 스타일
인라인 스타일은 재사용이 어렵고, 유지보수를 방해하기 때문에
테스트나 특수한 경우에만 사용하기  -->
