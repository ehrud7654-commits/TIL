<!-- 해당 문서가 html로 문서라는 것을 나타냄 -->
<!DOCTYPE html>
<!-- html 문서 시작/ 웹페이지의 기본 언어가 영어(en) -->
<html lang = "en">
<!-- 사람 눈에 안 보이는 정보들 - 문자 인코딩, 페이지 제목(브라우저 탭에 보임), css -->
<head> 
    <title> Document </title>
</head>
<!-- 화면에 실제로 보이는 내용 -->
<body>
    <!-- 문단 -->
    <p>My page</p>
    <a href="https://www.google.co.kr/">Google</a>
    <img src = "https://picsum.photos/200/300?grayscale" alt="sample-img">
    <!-- <img src="이미지 경로" alt="대체 텍스트(이미지 경로에 문제가 발생했을 때 출력되는 텍스트)"> -->
    <!-- br은 줄 바꿈, 엔터 역할(닫는 태그 없음) -->
    <h1>메인 대제목</h1> <br>
    <h2>중제목</h2>
    <p>안녕<strong>하세요</strong><em>황도경</em>입니다.</p>
    <p>반갑습니다. <b>누구누구</b> 입니다.</p>
    
</body>
</html>
