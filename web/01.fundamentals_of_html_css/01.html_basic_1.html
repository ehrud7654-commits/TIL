<!-- 해당 문서가 html로 문서라는 것을 나타냄 -->
<!DOCTYPE html>
<!-- 전체 페이지의 콘텐츠를 포함 -->
<html>
<!-- html문서에 관련된 설명, 설정 등 컴퓨터가 식별하는 메타데이터 작성
사용자에게 보이지 않음 -->
<head>
  <!-- 이 웹페이지는 UTF-8 방식으로 글자를 저장하고 읽음 -->
  <meta charset="UTF-8">
  <!-- 브라우저 탭 및 즐겨찾기 시 표시되는 제목으로 사용 -->
  <title>싸피페이지</title>
</head>
 <!-- html문서의 내용을 나타냄. 페이지에 표시되는 모든 콘텐츠를 작성. 
 한 문서에 하나의 body 요소만 존재 -->
<body>
  <p>웹페이지 입니다.</p>
</body>
</html>
